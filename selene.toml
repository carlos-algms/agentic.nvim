std = "vim"

exclude = [
    "lazy_repro/**",
    "deps/**",
    ".local/**",
    # Files with goto/label syntax not supported by selene parser
    # FIXIT: Remove the goto/labe syntax from these files and then remove these exclusions
    "lua/agentic/ui/diff_preview.lua",
    "lua/agentic/ui/tool_call_diff.lua",
    "lua/agentic/ui/message_writer.lua",
]

[lints]
# Luacheck compatibility (must keep as allow)
unused_variable = "allow"
shadowing = "allow"
mixed_table = "allow"

# Strictness upgrades (warn → deny) for more type safety
unbalanced_assignments = "deny"
unscoped_variables = "deny"
global_usage = "deny"
must_use = "deny"
multiple_statements = "deny"
empty_if = "deny"
empty_loop = "deny"
bad_string_escape = "deny"
manual_table_clone = "deny"
parenthese_conditions = "deny"

[config]
unused_variable.ignore_pattern = "^_"
shadowing.ignore_pattern = "^_"
empty_if.comments_count = true
empty_loop.comments_count = true